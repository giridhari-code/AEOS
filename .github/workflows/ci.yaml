name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          targets: x86_64-unknown-none
      - uses: swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo deny check
      - run: tools/check/unsafe_budget.sh

  lint-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang-format clang-tidy cmake
      - run: clang-format --dry-run --Werror $(find hal drivers device -name '*.[ch]')
      - run: cmake -S hal -B build/hal && cmake -S drivers -B build/drivers && cmake -S device -B build/device

  lint-py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run bandit -r sdk perception vision audio planning reasoning learning simulation robotics communication
      - run: uv run pip-audit

  boundary-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tools/check/boundaries.sh
      - run: bash -c '! grep -rInE "\.(asm|S)$" --include="*.rs" --include="*.c" --include="*.h" kernel runtime memory scheduler ipc security network storage filesystem services cli plugins logging telemetry diagnostics sdk 2>/dev/null | grep -v "kernel/src/arch" | grep -v "boot/" | grep -q .'

  test-rust:
    runs-on: ubuntu-latest
    needs: [lint-rust, boundary-checks]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          targets: x86_64-unknown-none
      - uses: swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  test-c:
    runs-on: ubuntu-latest
    needs: lint-c
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - run: cmake -S hal -B build/hal -DCMAKE_BUILD_TYPE=Debug -DAEOS_SANITIZE=ON
      - run: cmake --build build/hal && ctest --test-dir build/hal
      - run: cmake -S drivers -B build/drivers && cmake --build build/drivers && ctest --test-dir build/drivers
      - run: cmake -S device -B build/device && cmake --build build/device && ctest --test-dir build/device

  test-py:
    runs-on: ubuntu-latest
    needs: lint-py
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-branch --cov-fail-under=80

  boot-smoke:
    runs-on: ubuntu-latest
    needs: test-rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          targets: x86_64-unknown-none
      - uses: swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 grub-pc-bin xorriso mtools nasm
      - run: make build-iso
      - run: timeout 60 qemu-system-x86_64 -cdrom build/aeos.iso -serial stdio -no-reboot | tee /tmp/boot.log && grep -q "AEOS kernel booted" /tmp/boot.log

  docs:
    runs-on: ubuntu-latest
    needs: lint-py
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: uv sync --locked --group docs
      - run: bash scripts/docs.sh
