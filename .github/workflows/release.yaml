name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  packages: write

env:
  PYTHON_VERSION: "3.13"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          targets: x86_64-unknown-none
      - uses: astral-sh/setup-uv@v7
      - uses: swatinem/rust-cache@v2

      - name: Verify tag matches workspace version
        run: |
          ver=$(cargo metadata --no-deps --format-version 1 | python3 -c \
            "import json,sys;print(json.load(sys.stdin)['packages'][0]['version'])")
          test "v$ver" = "${{ github.ref_name }}" || { echo "tag mismatch"; exit 1; }

      - name: Reproducibility check (build twice, diff kernel image)
        run: |
          make build-release
          cp build/aeos.iso /tmp/aeos-1.iso
          cargo clean --release
          make build-release
          cmp /tmp/aeos-1.iso build/aeos.iso

      - name: Build release artifacts
        run: |
          make build-iso
          uv build --all

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with: { format: cyclonedx-json, output-file: build/aeos-sbom.cdx.json }

      - name: Sign artifacts
        uses: sigstore/cosign-installer@v3
        with: { cosign-release: v2.4.1 }
      - run: |
          cosign sign-blob --yes build/aeos.iso > build/aeos.iso.sig
          cosign sign-blob --yes build/aeos-sbom.cdx.json > build/aeos-sbom.cdx.json.sig

      - name: Publish Python packages
        run: uv publish --publish-url https://pypi.org/legacy/

      - name: Publish OCI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/build/runtime.Dockerfile
          push: true
          tags: |
            ghcr.io/aeos/aeos:${{ github.ref_name }}
            ghcr.io/aeos/aeos:latest

      - name: Create GitHub release with changelog
        uses: release-drafter/release-drafter@v7
        with: { version: "${{ github.ref_name }}" }

      - name: Deploy docs
        run: |
          uv sync --locked --group docs
          bash scripts/docs.sh
