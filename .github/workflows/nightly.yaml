name: Nightly

on:
  schedule: [{ cron: "0 2 * * *" }]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          targets: x86_64-unknown-none
      - uses: astral-sh/setup-uv@v4
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 grub-pc-bin xorriso mtools nasm
      - run: make build-iso
      - run: uv sync --locked --group dev
      - run: uv run pytest tests/e2e --scenarios all --durations=20

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.85.0, components: llvm-tools }
      - uses: astral-sh/setup-uv@v4
      - run: cargo fuzz run --fuzz-dir tests/fuzz -- -runs=30000
      - run: uv run pytest tests/fuzz --timeout 1800

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.85.0 }
      - uses: swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v4
      - run: cargo bench --workspace -- --save-baseline nightly
      - run: cargo bench --workspace -- --baseline nightly --load-baseline main 2>/dev/null || true
      - run: uv sync --locked --group dev
      - run: uv run pytest tests/ai -m bench --benchmark-autosave

  dependency-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.85.0 }
      - uses: astral-sh/setup-uv@v4
      - run: cargo update --dry-run
      - run: cargo deny check advisories
      - run: uv lock --check
      - run: uv run pip-audit
      - run: uv run bandit -r sdk perception vision audio planning reasoning learning simulation robotics communication

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: c-cpp, python, rust }
      - uses: github/codeql-action/analyze@v3
