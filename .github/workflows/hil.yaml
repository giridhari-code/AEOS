name: HIL

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: hil-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  hardware:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-hil')
    runs-on: [self-hosted, hil-lab]
    environment: hardware-lab
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.85.0 }
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --group dev
      - name: HAL contract suite on hardware
        run: uv run pytest tests/hil -m safety --halt-on-failure
      - name: Driver bring-up matrix
        run: uv run pytest tests/hil --driver-matrix
      - name: Archive hardware telemetry
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hil-telemetry
          path: runs/**/*
          if-no-files-found: ignore

  gate:
    runs-on: ubuntu-latest
    needs: hardware
    steps:
      - run: echo "HIL gate passed - release criteria met"
