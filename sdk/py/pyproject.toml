[project]
name = "aeos-sdk"
version = "0.1.0"
description = "AEOS developer SDK - the only Python-to-kernel boundary"
readme = "../../README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeos_sdk"]
